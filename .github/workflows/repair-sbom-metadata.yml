name: repair-sbom-metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout field-service branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: field-service/rebuild-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add version metadata and validate CycloneDX output
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm pkg set version=1.0.0
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          cd ..
          mkdir -p artifacts/sbom
          cd backend
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx > ../artifacts/sbom/backend.cdx.json
          cd ../frontend
          npm sbom --sbom-format cyclonedx > ../artifacts/sbom/frontend.cdx.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          for (const file of ['../artifacts/sbom/backend.cdx.json', '../artifacts/sbom/frontend.cdx.json']) {
            const document = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (document.bomFormat !== 'CycloneDX' || !document.metadata?.component?.version) {
              throw new Error(`Invalid CycloneDX metadata in ${file}`);
            }
          }
          NODE

      - name: Commit validated frontend metadata
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend SBOM metadata is already current."
            exit 0
          fi
          git config user.name "TiM Supply Chain Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "build(frontend): add version metadata for SBOM generation"
          git push origin HEAD:field-service/rebuild-foundation
