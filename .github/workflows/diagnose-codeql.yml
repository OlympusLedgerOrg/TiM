name: diagnose-codeql

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract the prior CodeQL failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_JOB_ID: "89234525189"
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            -o /tmp/codeql.log
          grep -iE "(^|[^a-z])(error|failed|failure|forbidden|sarif|upload|not enabled|resource not accessible)([^a-z]|$)" /tmp/codeql.log | tail -80
