name: extract-coverage

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Print measured coverage totals
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COVERAGE_JOB_ID: "89254262723"
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${COVERAGE_JOB_ID}/logs" \
            -o /tmp/coverage.log
          grep -E "^(Statements|Branches|Functions|Lines)[[:space:]]*:" /tmp/coverage.log
