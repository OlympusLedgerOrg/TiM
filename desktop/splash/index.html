<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TiM — Starting...</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="splash-container">
    <!-- Logo/Title -->
    <div class="logo-section">
      <div class="logo">
        <svg viewBox="0 0 100 100" class="logo-icon">
          <rect x="10" y="20" width="80" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="4"/>
          <line x1="10" y1="40" x2="90" y2="40" stroke="currentColor" stroke-width="4"/>
          <circle cx="30" cy="30" r="5" fill="currentColor"/>
          <circle cx="50" cy="30" r="5" fill="currentColor"/>
          <circle cx="70" cy="30" r="5" fill="currentColor"/>
          <line x1="20" y1="55" x2="50" y2="55" stroke="currentColor" stroke-width="3"/>
          <line x1="20" y1="65" x2="70" y2="65" stroke="currentColor" stroke-width="3"/>
        </svg>
      </div>
      <h1 class="title">TiM</h1>
      <p class="subtitle">Work Order Management System</p>
    </div>

    <!-- Progress Section -->
    <div class="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="status-text" id="status-text">Initializing...</p>
    </div>

    <!-- Error Section (hidden by default) -->
    <div class="error-section" id="error-section" style="display: none;">
      <div class="error-icon">⚠️</div>
      <p class="error-text" id="error-text"></p>
      <button class="error-button" id="error-button">View Logs</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="version" id="version">v1.0.0</span>
    </div>
  </div>

  <script>
    // Handle splash screen updates from main process
    if (window.electronAPI) {
      window.electronAPI.onSplashUpdate((data) => {
        switch (data.type) {
          case 'progress':
            const fill = document.getElementById('progress-fill');
            if (fill) {
              fill.style.width = `${data.data}%`;
            }
            break;

          case 'status':
            const status = document.getElementById('status-text');
            if (status) {
              status.textContent = String(data.data);
            }
            break;

          case 'error':
            const progressSection = document.querySelector('.progress-section');
            const errorSection = document.getElementById('error-section');
            const errorText = document.getElementById('error-text');

            if (progressSection) {
              progressSection.style.display = 'none';
            }
            if (errorSection) {
              errorSection.style.display = 'block';
            }
            if (errorText) {
              errorText.textContent = String(data.data);
            }
            break;
        }
      });

      // Get app version
      window.electronAPI.getAppVersion().then((version) => {
        const versionEl = document.getElementById('version');
        if (versionEl) {
          versionEl.textContent = `v${version}`;
        }
      });

      // Error button handler
      document.getElementById('error-button')?.addEventListener('click', () => {
        window.electronAPI.openLogFolder();
      });
    }
  </script>
</body>
</html>
