name: Apply field-service rebuild

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-service-rebuild
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-service/rebuild-foundation
          fetch-depth: 0

      - name: Reassemble, verify, and apply the rebuild
        shell: bash
        run: |
          if [[ -f backend/src/services/fieldServiceService.ts ]]; then
            echo "Field-service source is already applied."
            exit 0
          fi

          cat .field-service-patch/part-* > /tmp/tim-field-service.patch
          echo "7293a47ed5ea57ce899b926ef170de954a989d408f38d53ab83647c72134f9be  /tmp/tim-field-service.patch" | sha256sum -c -
          git apply --check /tmp/tim-field-service.patch
          git apply --index /tmp/tim-field-service.patch

          # The automation token should not rewrite workflow definitions.
          # CI is updated separately through the authenticated GitHub connector.
          git restore --staged .github/workflows/ci.yml
          git restore .github/workflows/ci.yml

          git config user.name "TiM Rebuild Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: rebuild TiM for field service operations"
          git push origin HEAD:field-service/rebuild-foundation
