name: refresh-backend-lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-backend-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Refresh, audit, build, test, and commit backend lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
          JWT_SECRET: test-secret
          NODE_ENV: test
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${BRANCH_NAME}"
          git checkout -q -B "${BRANCH_NAME}" FETCH_HEAD

          cd backend
          npm install --save-exact express@5.2.1 --silent
          npm audit fix --silent || true
          npm ci --silent
          npm audit --audit-level=high
          npx prisma generate >/dev/null
          npm run build
          npm test -- --runInBand
          cd ..

          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Backend dependency files already satisfy the audit."
            exit 0
          fi

          git config user.name "TiM Dependency Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(deps): remediate backend audit findings"
          git push origin HEAD:"${BRANCH_NAME}"
