name: repair-migration-baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout field-service branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: field-service/rebuild-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Generate a complete PostgreSQL baseline
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/20260723_initial_schema
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/20260723_initial_schema/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          grep -q 'CREATE TABLE "WorkOrder"' prisma/migrations/20260723_initial_schema/migration.sql
          grep -q 'CREATE TABLE "FieldWorkOrder"' prisma/migrations/20260723_initial_schema/migration.sql

      - name: Commit repaired migration history
        shell: bash
        run: |
          set -euo pipefail
          git add -A backend/prisma/migrations
          if git diff --cached --quiet; then
            echo "Migration baseline is already current."
            exit 0
          fi
          git config user.name "TiM Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "db: replace broken history with complete pre-release baseline"
          git push origin HEAD:field-service/rebuild-foundation
