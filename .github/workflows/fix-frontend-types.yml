name: fix-frontend-types

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout field-service branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: field-service/rebuild-foundation
          fetch-depth: 0

      - name: Apply strict TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          management = Path('frontend/src/components/ManagementDashboard.tsx')
          text = management.read_text()
          old = 'label={({ code, percent }) => `${code} (${(percent * 100).toFixed(0)}%)`}'
          new = "label={({ name, percent }) => `${String(name ?? 'Unknown')} (${((percent ?? 0) * 100).toFixed(0)}%)`}"
          if old not in text:
              raise SystemExit('ManagementDashboard target was not found')
          management.write_text(text.replace(old, new, 1))

          station = Path('frontend/src/components/StationDashboard.tsx')
          text = station.read_text()
          old = '{c.matNum}'
          new = '{c.materialNumber}'
          if old not in text:
              raise SystemExit('StationDashboard target was not found')
          station.write_text(text.replace(old, new, 1))

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/src/components/ManagementDashboard.tsx frontend/src/components/StationDashboard.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "TiM CI Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(frontend): satisfy strict dashboard types"
          git push origin HEAD:field-service/rebuild-foundation
