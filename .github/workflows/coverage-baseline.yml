name: coverage-baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim
          POSTGRES_DB: tim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tim:tim@localhost:5432/tim_test
      JWT_SECRET: coverage-baseline-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci --ignore-scripts
      - working-directory: backend
        run: npx prisma generate
      - name: Measure repository coverage without enforcing a threshold
        working-directory: backend
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --coverage \
            --collectCoverageFrom='src/**/*.ts' \
            --coverageReporters=json-summary > /tmp/coverage.log 2>&1
          status=$?
          node --input-type=commonjs <<'NODE'
          const path = require('node:path');
          const summary = require('./coverage/coverage-summary.json');
          const total = summary.total;
          console.log('COVERAGE_TOTALS');
          for (const metric of ['statements', 'branches', 'functions', 'lines']) {
            console.log(`${metric}=${total[metric].pct}%`);
          }
          console.log('LOWEST_LINE_COVERAGE');
          Object.entries(summary)
            .filter(([file]) => file !== 'total')
            .map(([file, metrics]) => ({
              file: path.relative(process.cwd(), file),
              lines: metrics.lines.pct,
              statements: metrics.statements.pct,
              branches: metrics.branches.pct,
              functions: metrics.functions.pct,
            }))
            .sort((a, b) => a.lines - b.lines)
            .slice(0, 25)
            .forEach((row) => console.log(JSON.stringify(row)));
          NODE
          if [ "$status" -ne 0 ]; then
            tail -40 /tmp/coverage.log
          fi
          exit "$status"
