name: backend-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim
          POSTGRES_DB: tim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      DATABASE_URL: postgresql://tim:tim@localhost:5432/tim_test
      JWT_SECRET: test-secret
      NODE_ENV: test
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Test
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: test-secret
          DATABASE_URL: postgresql://tim:tim@localhost:5432/tim_test
          NODE_ENV: test
