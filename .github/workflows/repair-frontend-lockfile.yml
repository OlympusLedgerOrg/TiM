name: repair-frontend-lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout field-service branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: field-service/rebuild-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reclassify build tooling and remediate the lockfile
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.devDependencies ??= {};
          for (const name of ['@vitejs/plugin-react', 'vite-plugin-pwa']) {
            const version = packageJson.dependencies?.[name];
            if (!version) throw new Error(`${name} was not found in dependencies`);
            packageJson.devDependencies[name] = version;
            delete packageJson.dependencies[name];
          }
          packageJson.dependencies = Object.fromEntries(Object.entries(packageJson.dependencies).sort());
          packageJson.devDependencies = Object.fromEntries(Object.entries(packageJson.devDependencies).sort());
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run typecheck
          npm run build

      - name: Commit validated dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend dependency metadata is already current."
            exit 0
          fi
          git config user.name "TiM Dependency Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "security(frontend): repair dependency classification and lockfile"
          git push origin HEAD:field-service/rebuild-foundation
